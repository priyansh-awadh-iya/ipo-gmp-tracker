name: Daily IPO GMP Scraper & Alerter

on:
  schedule:
    # Runs at 02:30 UTC (8:00 AM IST) every day
    - cron: '30 2 * * *'
  workflow_dispatch:
    # Allows manual execution from the GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GMP Scraper & Alert Task
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          DELIVERY_METHOD: 'whatsapp' # Toggle to 'sms' if preferred
        run: |
          python main.py
