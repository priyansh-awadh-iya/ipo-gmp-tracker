# WARNING: Do NOT add a 'pull_request' trigger to this workflow.
# Doing so could expose repository secrets to pull requests submitted from forks.
# Only run this workflow on 'schedule' or 'workflow_dispatch'.

name: Daily IPO GMP Scraper & Alerter

on:
  schedule:
    # Runs at 02:30 UTC (8:00 AM IST) every day
    - cron: '30 2 * * *'
  workflow_dispatch:
    # Allows manual execution from the GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GMP Scraper & Alert Task
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          DELIVERY_METHOD: ${{ secrets.DELIVERY_METHOD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmp-scraper-report
          path: report.md
